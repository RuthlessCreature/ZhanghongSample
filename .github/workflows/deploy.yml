name: Deploy Agent Hong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync MiniMax secret
        shell: bash
        run: |
          if [ -n "$MINIMAX_API_KEY" ]; then
            printf '%s' "$MINIMAX_API_KEY" | npx wrangler secret put MINIMAX_API_KEY
          else
            echo "MINIMAX_API_KEY secret not configured; skipping Worker secret sync."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          health=""
          for i in 1 2 3 4 5 6; do
            health="$(curl -fsS --retry 2 --retry-delay 2 --max-time 30 https://zhanghong.fhkq.best/api/health || true)"
            if printf '%s' "$health" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                try{
                  const x=JSON.parse(s);
                  const ok=x.ok&&x.configured&&["version-diff","drawing-review","comment-check","history-search","reference-assistant","geotech-conditions"].every(m=>x.modules?.includes(m));
                  process.exit(ok?0:1);
                }catch{process.exit(1)}
              });
            '; then
              break
            fi
            echo "Health not propagated yet; retry $i/6"
            sleep 5
          done
          printf '%s\n' "$health"
          printf '%s' "$health" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const x=JSON.parse(s);
              if(!x.ok || !x.configured) throw new Error("health not ready");
              for(const m of ["version-diff","drawing-review","comment-check","history-search","reference-assistant","geotech-conditions"]){
                if(!x.modules?.includes(m)) throw new Error("missing module: "+m);
              }
              console.log("Agent Hong health smoke passed");
            });
          '
          for page in version-diff.html drawing-review.html comment-check.html history-search.html reference-assistant.html geotech-conditions.html; do
            ok=""
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 30 "https://zhanghong.fhkq.best/$page" >/dev/null; then
                ok="yes"
                break
              fi
              echo "$page not propagated yet; retry $i/6"
              sleep 5
            done
            if [ "$ok" != "yes" ]; then
              echo "Page smoke failed: $page"
              exit 1
            fi
          done
          echo "Agent Hong module pages smoke passed"
      - name: Production Module 06 geotech regression
        shell: bash
        env:
          GEOTECH_API_URL: https://zhanghong.fhkq.best/api/geotech-conditions
        run: node tests/geotech-pdf.integration.mjs
