name: Deploy Agent Hong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync MiniMax secret
        shell: bash
        run: |
          if [ -n "$MINIMAX_API_KEY" ]; then
            printf '%s' "$MINIMAX_API_KEY" | npx wrangler secret put MINIMAX_API_KEY
          else
            echo "MINIMAX_API_KEY secret not configured; skipping Worker secret sync."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      - name: Production Module 02 regression
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for i in 1 2 3 4 5 6; do
            if body="$(curl -fsS --max-time 120 https://zhanghong.fhkq.best/api/__review_regression_8f31)"; then
              break
            fi
            echo "Regression endpoint not ready yet; retry $i/6"
            sleep 8
          done
          printf '%s\n' "$body"
          printf '%s' "$body" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const x=JSON.parse(s);
              const required=["hardW03","crossElevation","crossSchedule","noFakeCompliance"];
              if(!x.ok) throw new Error("module02 regression ok=false");
              for(const k of required){
                if(!x.checks?.[k]) throw new Error("module02 regression failed: "+k);
              }
              console.log("Module 02 production regression passed", x.checks);
            });
          '
