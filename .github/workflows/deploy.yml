name: Deploy Agent Hong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync MiniMax secret
        shell: bash
        run: |
          if [ -n "$MINIMAX_API_KEY" ]; then
            printf '%s' "$MINIMAX_API_KEY" | npx wrangler secret put MINIMAX_API_KEY
          else
            echo "MINIMAX_API_KEY secret not configured; skipping Worker secret sync."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --retry 5 --retry-delay 5 --max-time 30 https://zhanghong.fhkq.best/api/health)"
          printf '%s\n' "$health"
          printf '%s' "$health" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const x=JSON.parse(s);
              if(!x.ok || !x.configured) throw new Error("health not ready");
              for(const m of ["version-diff","drawing-review"]){
                if(!x.modules?.includes(m)) throw new Error("missing module: "+m);
              }
              console.log("Agent Hong health smoke passed");
            });
          '
          curl -fsS --retry 5 --retry-delay 5 --max-time 30 https://zhanghong.fhkq.best/version-diff.html >/dev/null
          curl -fsS --retry 5 --retry-delay 5 --max-time 30 https://zhanghong.fhkq.best/drawing-review.html >/dev/null
          echo "Agent Hong module pages smoke passed"
      - name: Module 02 V2 dual production regression
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for i in 1 2 3 4 5 6; do
            if body="$(curl -fsS --max-time 240 https://zhanghong.fhkq.best/api/__module02_v2_regression_43da)"; then
              break
            fi
            echo "Regression endpoint not ready; retry $i/6"
            sleep 8
          done
          printf '%s\n' "$body"
          printf '%s' "$body" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const x=JSON.parse(s);
              if(!x.ok) throw new Error("module02 v2 regression ok=false");
              for(const [k,v] of Object.entries(x.checks||{})){
                if(!v) throw new Error("module02 v2 regression failed: "+k);
              }
              console.log("Module 02 V2 dual production regression passed", x.checks);
            });
          '
